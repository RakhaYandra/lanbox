name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lanbox
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: RakhaYandra/lanbox-web
          path: lanbox-web
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: lanbox-web/package-lock.json
      - name: Build web UI
        working-directory: lanbox-web
        run: |
          npm ci
          npm run build
          cd dist && zip -r ../lanbox-web-dist.zip . && cd ..
          ls -la lanbox-web-dist.zip
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          workdir: lanbox
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach web dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" lanbox-web/lanbox-web-dist.zip \
            --repo RakhaYandra/lanbox --clobber
